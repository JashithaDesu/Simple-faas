apiVersion: apps/v1
kind: Deployment
metadata:
  name: mini-faas-gateway
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mini-faas-gateway
  template:
    metadata:
      labels:
        app: mini-faas-gateway
    spec:
      serviceAccountName: gateway-sa
      containers:
        - name: gateway
          image: mini-faas-gateway:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: mini-faas-gateway
  namespace: default
spec:
  selector:
    app: mini-faas-gateway
  ports:
    - port: 8080
      targetPort: 8080
