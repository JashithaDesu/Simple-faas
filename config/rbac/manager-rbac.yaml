apiVersion: v1
kind: ServiceAccount
metadata:
  name: manager-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
  - apiGroups: ["faas.jashitha.dev"]
    resources: ["functions"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["faas.jashitha.dev"]
    resources: ["functions/status"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: manager-rolebinding
subjects:
  - kind: ServiceAccount
    name: manager-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: manager-role
  apiGroup: rbac.authorization.k8s.io
